name: Build Kernel Lisa + SukiSU-Ultra (Manual Hook)

on:
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: 'SukiSU-Ultra branch'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - susfs-main
          - susfs-test
      apply_optional_patches:
        description: 'Apply optional patches (input hook for Safe Mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      clang_version:
        description: 'Clang toolchain'
        required: true
        default: 'proton'
        type: choice
        options:
          - proton
          - zyc

env:
  KERNEL_REPO: https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa
  KERNEL_BRANCH: thirteen
  DEVICE: lisa
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    # ── 1. Checkout this repo ──────────────────────────────────────────
    - name: Checkout workflow repo
      uses: actions/checkout@v4

    # ── 2. Install dependencies ────────────────────────────────────────
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex \
          git gnupg2 libelf-dev libncurses-dev libssl-dev lld llvm \
          python3 python-is-python3 unzip wget zip zstd

    # ── 3. Clone kernel source ─────────────────────────────────────────
    - name: Clone kernel source
      run: |
        git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} \
          ${{ env.KERNEL_REPO }} kernel
        echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV

    # ── 4. Integrate SukiSU-Ultra (LKM mode via bash -s main) ─────────
    #
    # NOTE: Using `bash -s main` (not `bash -s builtin`).
    # This sets up SukiSU-Ultra as a Loadable Kernel Module.
    #
    - name: Setup SukiSU-Ultra
      working-directory: kernel
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ inputs.sukisu_branch }}/kernel/setup.sh" \
          | bash -s main
        echo "✅ SukiSU-Ultra integrated (branch: ${{ inputs.sukisu_branch }}, mode: main)"

    # ── 5. Integrate SUSFS (required by SukiSU-Ultra main branch) ──────
    #
    # SukiSU-Ultra includes <linux/susfs.h> and <linux/susfs_def.h>.
    # Try full susfs4ksu integration; fall back to stub headers.
    #
    - name: Integrate SUSFS
      working-directory: kernel
      run: |
        echo "📦 Integrating SUSFS..."

        KERNEL_VER=$(make kernelversion 2>/dev/null | cut -d. -f1-2)
        echo "Kernel version: $KERNEL_VER"

        SUSFS_APPLIED=false

        # Try cloning susfs4ksu
        if git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git "$GITHUB_WORKSPACE/susfs4ksu" 2>/dev/null; then
          echo "✅ susfs4ksu cloned"

          # Try to apply kernel patch
          SUSFS_PATCH=""
          for p in \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-${KERNEL_VER}.patch" \
            "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.4.patch"; do
            if [ -f "$p" ]; then
              SUSFS_PATCH="$p"
              break
            fi
          done

          if [ -n "$SUSFS_PATCH" ]; then
            echo "📌 Applying: $(basename "$SUSFS_PATCH")"
            if git apply --check "$SUSFS_PATCH" 2>/dev/null && git apply "$SUSFS_PATCH"; then
              SUSFS_APPLIED=true
              echo "✅ SUSFS kernel patch applied"
            elif patch -p1 --forward --no-backup-if-mismatch < "$SUSFS_PATCH" 2>/dev/null; then
              SUSFS_APPLIED=true
              echo "✅ SUSFS kernel patch applied (patch -p1)"
            else
              echo "⚠️ SUSFS kernel patch failed to apply"
            fi
          fi

          # Apply KSU enable patch
          KSU_SUSFS_PATCH=$(find "$GITHUB_WORKSPACE/susfs4ksu/kernel_patches/KernelSU" -name "*enable_susfs*" -type f 2>/dev/null | head -1)
          if [ -n "$KSU_SUSFS_PATCH" ] && [ "$SUSFS_APPLIED" = "true" ]; then
            echo "📌 Applying: $(basename "$KSU_SUSFS_PATCH")"
            git apply "$KSU_SUSFS_PATCH" 2>/dev/null || \
              patch -p1 --forward --no-backup-if-mismatch < "$KSU_SUSFS_PATCH" 2>/dev/null || true
          fi

          # Copy susfs headers if available
          for hdr in susfs.h susfs_def.h susfs_redirect.h; do
            SRC=$(find "$GITHUB_WORKSPACE/susfs4ksu" -name "$hdr" -path "*/include/*" -type f 2>/dev/null | head -1)
            if [ -n "$SRC" ] && [ ! -f "include/linux/$hdr" ]; then
              cp "$SRC" "include/linux/$hdr"
              echo "✅ Copied $hdr to include/linux/"
            fi
          done
        else
          echo "⚠️ Could not clone susfs4ksu"
        fi

        # ── Fallback: create stub headers if still missing ──
        if [ ! -f "include/linux/susfs.h" ]; then
          echo "📝 Creating stub include/linux/susfs.h"
          cat > include/linux/susfs.h << 'STUBEOF'
#ifndef _LINUX_SUSFS_H
#define _LINUX_SUSFS_H
#include <linux/types.h>
#endif /* _LINUX_SUSFS_H */
STUBEOF
        fi

        if [ ! -f "include/linux/susfs_def.h" ]; then
          echo "📝 Creating stub include/linux/susfs_def.h"
          cat > include/linux/susfs_def.h << 'STUBEOF'
#ifndef _LINUX_SUSFS_DEF_H
#define _LINUX_SUSFS_DEF_H
#endif /* _LINUX_SUSFS_DEF_H */
STUBEOF
        fi

        if [ ! -f "include/linux/susfs_redirect.h" ]; then
          echo "📝 Creating stub include/linux/susfs_redirect.h"
          cat > include/linux/susfs_redirect.h << 'STUBEOF'
#ifndef _LINUX_SUSFS_REDIRECT_H
#define _LINUX_SUSFS_REDIRECT_H
#endif /* _LINUX_SUSFS_REDIRECT_H */
STUBEOF
        fi

        echo "SUSFS_APPLIED=$SUSFS_APPLIED" >> $GITHUB_ENV

        # Verify all headers exist
        echo "── SUSFS headers check ──"
        for hdr in susfs.h susfs_def.h susfs_redirect.h; do
          if [ -f "include/linux/$hdr" ]; then
            echo "  ✅ include/linux/$hdr"
          else
            echo "  ❌ include/linux/$hdr MISSING"
          fi
        done
        echo "✅ SUSFS integration complete (full=$SUSFS_APPLIED)"

    # ── 6. Apply manual hooks ──────────────────────────────────────────
    - name: Apply manual hook insertions
      run: |
        chmod +x scripts/apply-hooks.sh
        bash scripts/apply-hooks.sh \
          "$GITHUB_WORKSPACE/kernel" \
          "${{ inputs.apply_optional_patches }}"

    # ── 7. Fix Clang compatibility ─────────────────────────────────────
    - name: Patch kernel for Clang compatibility
      working-directory: kernel
      run: |
        echo "🔧 Fixing Clang compatibility issues..."

        # Fix 1: typecheck.h — zero-init __dummy2
        TYPECHECK="include/linux/typecheck.h"
        if [ -f "$TYPECHECK" ]; then
          if grep -q 'typeof(x) __dummy2;' "$TYPECHECK"; then
            sed -i 's/typeof(x) __dummy2;/typeof(x) __dummy2 = (typeof(x))0;/' "$TYPECHECK"
            echo "✅ Fixed typecheck.h"
          fi
        fi

        # Fix 2: sde_hw_dsc_1_2.c — missing return type on function
        DSC_FILE="techpack/display/msm/sde/sde_hw_dsc_1_2.c"
        if [ -f "$DSC_FILE" ]; then
          if grep -q '^static inline _dsc_subblk_offset' "$DSC_FILE"; then
            sed -i 's/^static inline _dsc_subblk_offset/static inline int _dsc_subblk_offset/' "$DSC_FILE"
            echo "✅ Fixed sde_hw_dsc_1_2.c: added int return type"
          fi
        fi

        echo "✅ Clang compatibility patches applied"

    # ── 8. Find & modify defconfig ─────────────────────────────────────
    - name: Modify defconfig
      working-directory: kernel
      run: |
        DEFCONFIG=""
        for candidate in \
          "arch/${{ env.ARCH }}/configs/lisa_defconfig" \
          "arch/${{ env.ARCH }}/configs/vendor/lahaina-qgki_defconfig" \
          "arch/${{ env.ARCH }}/configs/vendor/lisa_defconfig"; do
          if [ -f "$candidate" ]; then
            DEFCONFIG="$candidate"
            break
          fi
        done

        if [ -z "$DEFCONFIG" ]; then
          echo "❌ No defconfig found!"
          find arch/${{ env.ARCH }}/configs -name "*lisa*" -o -name "*lahaina*" 2>/dev/null
          exit 1
        fi

        echo "📝 Using defconfig: $DEFCONFIG"
        DEFCONFIG_NAME=$(basename "$DEFCONFIG")
        echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> $GITHUB_ENV

        # Remove conflicting entries
        sed -i '/CONFIG_KSU/d'           "$DEFCONFIG"
        sed -i '/CONFIG_KPROBES/d'       "$DEFCONFIG"
        sed -i '/CONFIG_HAVE_KPROBES/d'  "$DEFCONFIG"
        sed -i '/CONFIG_KPROBE_EVENTS/d' "$DEFCONFIG"

        # Append SukiSU-Ultra config
        cat >> "$DEFCONFIG" << 'EOF'

# SukiSU-Ultra Manual Hook
CONFIG_KSU=y
CONFIG_KSU_MANUAL_HOOK=y
# CONFIG_KPROBES is not set
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
EOF

        # SUSFS config
        if [ "${SUSFS_APPLIED:-false}" = "true" ]; then
          echo "CONFIG_KSU_SUSFS=y" >> "$DEFCONFIG"
          echo "✅ Added CONFIG_KSU_SUSFS=y"
        else
          echo "# CONFIG_KSU_SUSFS is not set" >> "$DEFCONFIG"
          echo "ℹ️  SUSFS disabled (stub headers only)"
        fi

        echo "✅ Defconfig updated"
        grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS" "$DEFCONFIG" || true

    # ── 9. Setup toolchain ─────────────────────────────────────────────
    - name: Setup Clang toolchain
      run: |
        mkdir -p "$GITHUB_WORKSPACE/toolchain"

        if [ "${{ inputs.clang_version }}" = "proton" ]; then
          echo "📦 Cloning Proton Clang..."
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            "$GITHUB_WORKSPACE/toolchain/clang"

        elif [ "${{ inputs.clang_version }}" = "zyc" ]; then
          echo "📦 Downloading ZyCromerZ Clang..."
          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang"
          ZYC_URL=$(curl -s https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt)
          wget -q "$ZYC_URL" -O zyc-clang.tar.gz
          tar -xf zyc-clang.tar.gz -C "$GITHUB_WORKSPACE/toolchain/clang"
          rm -f zyc-clang.tar.gz
        fi

        CLANG_BIN="$GITHUB_WORKSPACE/toolchain/clang/bin"
        echo "PATH=$CLANG_BIN:$PATH" >> $GITHUB_ENV
        echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV

        if [ -f "$CLANG_BIN/clang" ]; then
          echo "✅ Clang ready: $("$CLANG_BIN/clang" --version | head -1)"
        else
          echo "❌ Clang binary not found!"
          exit 1
        fi

    # ── 10. Build kernel ───────────────────────────────────────────────
    - name: Build kernel
      working-directory: kernel
      run: |
        export PATH="${CLANG_BIN}:$PATH"

        # KCFLAGS: Suppress newer Clang warnings for 5.4 kernel (11 flags)
        KCFLAGS_VAL="-Wno-default-const-init-var-unsafe"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-default-const-init-field-unsafe"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-sometimes-uninitialized"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-uninitialized"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-enum-conversion"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-implicit-function-declaration"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-implicit-int"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-int-conversion"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-unused-function"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-gnu-offsetof-extensions"
        KCFLAGS_VAL="$KCFLAGS_VAL -Wno-single-bit-bitfield-constant-conversion"

        MAKE_ARGS=(
          ARCH=${{ env.ARCH }}
          SUBARCH=${{ env.ARCH }}
          CC=clang
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          CLANG_TRIPLE=aarch64-linux-gnu-
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
          LD=ld.lld
          O=out
          KCFLAGS="$KCFLAGS_VAL"
        )

        echo "══════════════════════════════════════════"
        echo "  Generating config: ${DEFCONFIG_NAME}"
        echo "══════════════════════════════════════════"
        make "${MAKE_ARGS[@]}" "${DEFCONFIG_NAME}" 2>&1 | tee build_defconfig.log

        echo "── Verifying KSU in .config ──"
        grep -E "CONFIG_KSU" out/.config || echo "⚠️ KSU not found in .config"

        echo "══════════════════════════════════════════"
        echo "  Compiling kernel... ($(nproc --all) threads)"
        echo "  KCFLAGS: $KCFLAGS_VAL"
        echo "══════════════════════════════════════════"
        make "${MAKE_ARGS[@]}" -j$(nproc --all) 2>&1 | tee build_kernel.log

        KERNEL_IMAGE=""
        for img in \
          "out/arch/${{ env.ARCH }}/boot/Image" \
          "out/arch/${{ env.ARCH }}/boot/Image.gz" \
          "out/arch/${{ env.ARCH }}/boot/Image.gz-dtb"; do
          if [ -f "$img" ]; then
            KERNEL_IMAGE="$img"
            break
          fi
        done

        if [ -z "$KERNEL_IMAGE" ]; then
          echo "❌ Kernel build FAILED — no Image found!"
          echo "── Last 100 lines of build log ──"
          tail -100 build_kernel.log
          exit 1
        fi

        echo "✅ Kernel built: $KERNEL_IMAGE ($(stat -c%s "$KERNEL_IMAGE" | numfmt --to=iec))"
        echo "KERNEL_IMAGE=$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE" >> $GITHUB_ENV

        DTBO="out/arch/${{ env.ARCH }}/boot/dtbo.img"
        if [ -f "$DTBO" ]; then
          echo "DTBO_IMG=$GITHUB_WORKSPACE/kernel/$DTBO" >> $GITHUB_ENV
        fi

    # ── 11. Package AnyKernel3 ─────────────────────────────────────────
    - name: Package AnyKernel3 flashable zip
      run: |
        git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" AnyKernel3
        cd AnyKernel3

        rm -rf modules patch ramdisk LICENSE README.md

        cat > anykernel.sh << 'AKEOF'
# AnyKernel3 Ramdisk Mod Script
# osm0sis @ xda-developers

properties() { '
kernel.string=SukiSU-Ultra-ManualHook for lisa
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=lisa
device.name2=
supported.versions=
supported.patchlevels=
'; }

block=/dev/block/bootdevice/by-name/boot;
is_slot_device=auto;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

. tools/ak3-core.sh;

split_boot;
flash_boot;
flash_dtbo;
AKEOF

        cp "${{ env.KERNEL_IMAGE }}" .

        if [ -n "${DTBO_IMG:-}" ] && [ -f "$DTBO_IMG" ]; then
          cp "$DTBO_IMG" .
        fi

        DTB_DIR="${GITHUB_WORKSPACE}/kernel/out/arch/${{ env.ARCH }}/boot/dts"
        if [ -d "$DTB_DIR/vendor/qcom" ]; then
          find "$DTB_DIR/vendor/qcom" -name "*.dtb" -exec cat {} + > dtb 2>/dev/null || true
        fi

        TIMESTAMP=$(date +%Y%m%d-%H%M)
        ZIP_NAME="SukiSU-Ultra-ManualHook-${{ env.DEVICE }}-${TIMESTAMP}.zip"
        zip -r9 "../${ZIP_NAME}" . -x '.git*'
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> $GITHUB_ENV
        echo "✅ Packaged: ${ZIP_NAME}"

    # ── 12. Upload artifact ────────────────────────────────────────────
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_PATH }}
        retention-days: 7

    # ── 13. Upload build log ───────────────────────────────────────────
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          kernel/build_defconfig.log
          kernel/build_kernel.log
        retention-days: 3

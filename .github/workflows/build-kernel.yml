name: Build Kernel Lisa + SukiSU-Ultra (Manual Hook)

on:
  workflow_dispatch:
    inputs:
      sukisu_branch:
        description: 'SukiSU-Ultra branch'
        required: true
        default: 'main'
        type: choice
        options:
          - main
          - susfs-main
          - susfs-test
      apply_optional_patches:
        description: 'Apply optional patches (input hook for Safe Mode)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      clang_version:
        description: 'Clang toolchain'
        required: true
        default: 'proton'
        type: choice
        options:
          - proton
          - zyc

env:
  KERNEL_REPO: https://github.com/PixelExperience-Devices/kernel_xiaomi_lisa
  KERNEL_BRANCH: thirteen
  DEVICE: lisa
  ARCH: arm64
  ANYKERNEL_REPO: https://github.com/osm0sis/AnyKernel3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
    # ── 1. Checkout this repo (scripts + workflow) ─────────────────────
    - name: Checkout workflow repo
      uses: actions/checkout@v4

    # ── 2. Install dependencies ────────────────────────────────────────
    - name: Install build dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          bc bison build-essential ca-certificates cpio curl flex \
          git gnupg2 libelf-dev libncurses-dev libssl-dev lld llvm \
          python3 python-is-python3 unzip wget zip zstd

    # ── 3. Clone kernel source ─────────────────────────────────────────
    - name: Clone kernel source
      run: |
        git clone --depth=1 -b ${{ env.KERNEL_BRANCH }} \
          ${{ env.KERNEL_REPO }} kernel
        echo "KERNEL_DIR=$GITHUB_WORKSPACE/kernel" >> $GITHUB_ENV

    # ── 4. Integrate SukiSU-Ultra ──────────────────────────────────────
    - name: Setup SukiSU-Ultra (builtin mode)
      working-directory: kernel
      run: |
        curl -LSs \
          "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/${{ inputs.sukisu_branch }}/kernel/setup.sh" \
          | bash -s builtin
        echo "✅ SukiSU-Ultra integrated (branch: ${{ inputs.sukisu_branch }})"

    # ── 5. Apply manual hooks (sed/awk — no .patch files) ──────────────
    - name: Apply manual hook insertions
      run: |
        chmod +x scripts/apply-hooks.sh
        bash scripts/apply-hooks.sh \
          "$GITHUB_WORKSPACE/kernel" \
          "${{ inputs.apply_optional_patches }}"

    # ── 6. Find & modify defconfig ─────────────────────────────────────
    - name: Modify defconfig
      working-directory: kernel
      run: |
        # Dynamic defconfig search (device-specific → generic fallback)
        DEFCONFIG=""
        for candidate in \
          "arch/${{ env.ARCH }}/configs/lisa_defconfig" \
          "arch/${{ env.ARCH }}/configs/vendor/lahaina-qgki_defconfig" \
          "arch/${{ env.ARCH }}/configs/vendor/lisa_defconfig"; do
          if [ -f "$candidate" ]; then
            DEFCONFIG="$candidate"
            break
          fi
        done

        if [ -z "$DEFCONFIG" ]; then
          echo "❌ No defconfig found! Listing available:"
          find arch/${{ env.ARCH }}/configs -name "*lisa*" -o -name "*lahaina*" 2>/dev/null
          exit 1
        fi

        echo "📝 Using defconfig: $DEFCONFIG"
        DEFCONFIG_NAME=$(basename "$DEFCONFIG")
        echo "DEFCONFIG_NAME=$DEFCONFIG_NAME" >> $GITHUB_ENV

        # Remove conflicting entries
        sed -i '/CONFIG_KSU/d'          "$DEFCONFIG"
        sed -i '/CONFIG_KPROBES/d'      "$DEFCONFIG"
        sed -i '/CONFIG_HAVE_KPROBES/d' "$DEFCONFIG"
        sed -i '/CONFIG_KPROBE_EVENTS/d' "$DEFCONFIG"

        # Append SukiSU-Ultra config
        cat >> "$DEFCONFIG" << 'EOF'

# SukiSU-Ultra Manual Hook
CONFIG_KSU=y
CONFIG_KSU_MANUAL_HOOK=y
# CONFIG_KPROBES is not set
CONFIG_KALLSYMS=y
CONFIG_KALLSYMS_ALL=y
EOF

        echo "✅ Defconfig updated"
        echo "── KSU-related entries ──"
        grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_KALLSYMS" "$DEFCONFIG" || true

    # ── 7. Setup toolchain ─────────────────────────────────────────────
    - name: Setup Clang toolchain
      run: |
        mkdir -p "$GITHUB_WORKSPACE/toolchain"

        if [ "${{ inputs.clang_version }}" = "proton" ]; then
          echo "📦 Cloning Proton Clang..."
          git clone --depth=1 \
            https://github.com/kdrag0n/proton-clang.git \
            "$GITHUB_WORKSPACE/toolchain/clang"

        elif [ "${{ inputs.clang_version }}" = "zyc" ]; then
          echo "📦 Downloading ZyCromerZ Clang..."
          mkdir -p "$GITHUB_WORKSPACE/toolchain/clang"
          ZYC_URL=$(curl -s https://raw.githubusercontent.com/ZyCromerZ/Clang/main/Clang-main-link.txt)
          wget -q "$ZYC_URL" -O zyc-clang.tar.gz
          tar -xf zyc-clang.tar.gz -C "$GITHUB_WORKSPACE/toolchain/clang"
          rm -f zyc-clang.tar.gz
        fi

        CLANG_BIN="$GITHUB_WORKSPACE/toolchain/clang/bin"
        echo "PATH=$CLANG_BIN:$PATH" >> $GITHUB_ENV
        echo "CLANG_BIN=$CLANG_BIN" >> $GITHUB_ENV

        if [ -f "$CLANG_BIN/clang" ]; then
          echo "✅ Clang ready: $("$CLANG_BIN/clang" --version | head -1)"
        else
          echo "❌ Clang binary not found!"
          exit 1
        fi

    # ── 8. Build kernel ────────────────────────────────────────────────
    - name: Build kernel
      working-directory: kernel
      run: |
        export PATH="${CLANG_BIN}:$PATH"

        MAKE_ARGS=(
          ARCH=${{ env.ARCH }}
          SUBARCH=${{ env.ARCH }}
          CC=clang
          CROSS_COMPILE=aarch64-linux-gnu-
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          CLANG_TRIPLE=aarch64-linux-gnu-
          AR=llvm-ar
          NM=llvm-nm
          OBJCOPY=llvm-objcopy
          OBJDUMP=llvm-objdump
          STRIP=llvm-strip
          LD=ld.lld
          O=out
        )

        echo "══════════════════════════════════════════"
        echo "  Generating config: ${DEFCONFIG_NAME}"
        echo "══════════════════════════════════════════"
        make "${MAKE_ARGS[@]}" "${DEFCONFIG_NAME}" 2>&1 | tee build_defconfig.log

        echo "── Verifying KSU in .config ──"
        grep -E "CONFIG_KSU" out/.config || echo "⚠️ KSU not found in generated .config"

        echo "══════════════════════════════════════════"
        echo "  Compiling kernel..."
        echo "══════════════════════════════════════════"
        make "${MAKE_ARGS[@]}" -j$(nproc --all) 2>&1 | tee build_kernel.log

        # Locate output
        KERNEL_IMAGE=""
        for img in \
          "out/arch/${{ env.ARCH }}/boot/Image" \
          "out/arch/${{ env.ARCH }}/boot/Image.gz" \
          "out/arch/${{ env.ARCH }}/boot/Image.gz-dtb"; do
          if [ -f "$img" ]; then
            KERNEL_IMAGE="$img"
            break
          fi
        done

        if [ -z "$KERNEL_IMAGE" ]; then
          echo "❌ Kernel build FAILED — no Image found!"
          echo "── Last 80 lines of build log ──"
          tail -80 build_kernel.log
          exit 1
        fi

        echo "✅ Kernel built: $KERNEL_IMAGE ($(stat -c%s "$KERNEL_IMAGE" | numfmt --to=iec))"
        echo "KERNEL_IMAGE=$GITHUB_WORKSPACE/kernel/$KERNEL_IMAGE" >> $GITHUB_ENV

        # DTBO
        DTBO="out/arch/${{ env.ARCH }}/boot/dtbo.img"
        if [ -f "$DTBO" ]; then
          echo "DTBO_IMG=$GITHUB_WORKSPACE/kernel/$DTBO" >> $GITHUB_ENV
        fi

    # ── 9. Package AnyKernel3 ──────────────────────────────────────────
    - name: Package AnyKernel3 flashable zip
      run: |
        git clone --depth=1 "${{ env.ANYKERNEL_REPO }}" AnyKernel3
        cd AnyKernel3

        # Clean demo files
        rm -rf modules patch ramdisk LICENSE README.md

        # Write anykernel.sh for lisa
        cat > anykernel.sh << 'AKEOF'
# AnyKernel3 Ramdisk Mod Script
# osm0sis @ xda-developers

properties() { '
kernel.string=SukiSU-Ultra-ManualHook for lisa
do.devicecheck=1
do.modules=0
do.systemless=1
do.cleanup=1
do.cleanuponabort=0
device.name1=lisa
device.name2=
supported.versions=
supported.patchlevels=
'; }

block=/dev/block/bootdevice/by-name/boot;
is_slot_device=auto;
ramdisk_compression=auto;
patch_vbmeta_flag=auto;

. tools/ak3-core.sh;

split_boot;
flash_boot;
flash_dtbo;
AKEOF

        # Copy kernel image
        cp "${{ env.KERNEL_IMAGE }}" .

        # Copy DTBO if available
        if [ -n "${DTBO_IMG:-}" ] && [ -f "$DTBO_IMG" ]; then
          cp "$DTBO_IMG" .
        fi

        # Concatenate DTBs (if present)
        DTB_DIR="${GITHUB_WORKSPACE}/kernel/out/arch/${{ env.ARCH }}/boot/dts"
        if [ -d "$DTB_DIR/vendor/qcom" ]; then
          find "$DTB_DIR/vendor/qcom" -name "*.dtb" -exec cat {} + > dtb 2>/dev/null || true
        fi

        # Create flashable zip
        TIMESTAMP=$(date +%Y%m%d-%H%M)
        ZIP_NAME="SukiSU-Ultra-ManualHook-${{ env.DEVICE }}-${TIMESTAMP}.zip"
        zip -r9 "../${ZIP_NAME}" . -x '.git*'
        echo "ZIP_NAME=${ZIP_NAME}" >> $GITHUB_ENV
        echo "ZIP_PATH=${GITHUB_WORKSPACE}/${ZIP_NAME}" >> $GITHUB_ENV
        echo "✅ Packaged: ${ZIP_NAME}"

    # ── 10. Upload artifact ────────────────────────────────────────────
    - name: Upload kernel zip
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.ZIP_NAME }}
        path: ${{ env.ZIP_PATH }}
        retention-days: 7

    # ── 11. Upload build log ───────────────────────────────────────────
    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: |
          kernel/build_defconfig.log
          kernel/build_kernel.log
        retention-days: 3
